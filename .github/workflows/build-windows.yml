name: Build Windows executable

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install application and build tools
        run: python -m pip install -e ".[dev]"
      - name: Quality checks
        run: |
          ruff check .
          mypy src
          pytest --junitxml=reports/windows-junit.xml
      - name: Build standalone EXE
        shell: pwsh
        run: ./packaging/build-windows.ps1
      - name: Validate and archive
        shell: pwsh
        run: |
          $Exe = "dist/DroneMissionPlanner.exe"
          if ((Get-Item $Exe).Length -lt 10000000) { throw "Executable is unexpectedly small" }
          New-Item -ItemType Directory -Force -Path artifacts/DroneMissionPlanner-Windows-x64 | Out-Null
          Copy-Item $Exe artifacts/DroneMissionPlanner-Windows-x64/
          Copy-Item README.md, LICENSE artifacts/DroneMissionPlanner-Windows-x64/
          Copy-Item examples artifacts/DroneMissionPlanner-Windows-x64/examples -Recurse
          Compress-Archive artifacts/DroneMissionPlanner-Windows-x64/* artifacts/DroneMissionPlanner-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: DroneMissionPlanner-Windows-x64
          path: artifacts/DroneMissionPlanner-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
