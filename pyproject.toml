[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "drone-mission-planner"
version = "0.5.0"
description = "Fully local multi-UAV mission planning and dynamic simulation desktop application"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Xin-zimu"}]
dependencies = [
  "PySide6>=6.8,<7",
  "numpy>=2,<3",
  "pydantic>=2.10,<3",
  "networkx>=3.4,<4",
  "pyqtgraph>=0.13.7,<1",
  "ortools>=9.12,<10",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-qt>=4.4,<5",
  "ruff>=0.9,<1",
  "mypy>=1.15,<2",
  "pyinstaller>=6.12,<7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
qt_api = "pyside6"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".venv", "build", "dist", "artifacts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["drone_mission_planner"]
mypy_path = "src"
exclude = ["build", "dist", "artifacts"]

[[tool.mypy.overrides]]
module = ["PySide6.*", "pyqtgraph.*"]
ignore_missing_imports = true
