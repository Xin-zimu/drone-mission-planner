# DMP read-only hardware readiness configuration for Crazyswarm2.
# Merge the firmware_logging section into the Crazyswarm2 crazyflies.yaml used
# to launch crazyflie_server for cf231.
all:
  firmware_logging:
    enabled: true
    default_topics:
      pose:
        frequency: 10
      status:
        frequency: 1
      odom:
        frequency: 10
    custom_topics:
      # kalman.varPX/varPY/varPZ are the Kalman VELOCITY covariance, which is what the
      # official cflib wait_for_position_estimator() gates on. kalman.varX/varY/varZ are
      # the position covariance: under flow-only positioning they grow to the firmware
      # MAX_COVARIANCE ceiling and then sit there with zero span, so they cannot be used
      # as a convergence signal.
      dmp_readiness:
        frequency: 10
        vars:
          - range.zrange
          - kalman.varPX
          - kalman.varPY
          - kalman.varPZ

robots:
  cf231:
    enabled: true
    uri: radio://0/80/2M/E7E7E7E705
    type: cf21
