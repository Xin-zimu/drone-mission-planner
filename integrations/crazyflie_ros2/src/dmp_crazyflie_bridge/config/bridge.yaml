bind: 127.0.0.1
port: 8765
backend: sim
robot_id: cf231
robot_uri: radio://0/80/2M/E7E7E7E705
crazyflie_server_node: /crazyflie_server
hardware_flight_enabled: false
capability_snapshot_path: ../runtime/cf231_capabilities.json
capability_snapshot_max_age_s: 3600
battery_critical_voltage: 3.7
# Airborne battery threshold, applied to the LOADED in-flight measurement.
#
# `battery_critical_voltage` above is the GROUND/rested launch-clearance threshold and stays
# 3.7 V: a pack that cannot hold 3.7 V while stationary must not be cleared to launch.
#
# The official 250 mAh 1S pack, however, sags ~0.5 V the instant the motors load it. Measured
# on cf231: 4.048 V resting -> 3.552 V within 0.7 s of motor spin-up (and 4.043 -> 3.457 V on
# 2026-09-22). Comparing that LOADED voltage against the 3.7 V RESTED figure therefore fails
# for a healthy official pack and made flight impossible -- it aborted the 2026-10-14 takeoff
# before the aircraft left the ground.
#
# 3.3 V is anchored on this aircraft's own firmware protection, read live:
#   pm.lowVoltage = 3.2 V (warning),  pm.criticalLowVoltage = 3.0 V (hard power-off)
# Sitting above the firmware warning keeps the intended layering: the DMP detects a low pack
# first and lands under control; the firmware's hard cutoff stays the last resort.
# `minimum_battery_critical_samples` debounces it so one sagging sample cannot abort a flight.
battery_critical_airborne_voltage: 3.3
minimum_battery_critical_samples: 3
nominal_pose_rate_hz: 10
minimum_acceptable_pose_rate_hz: 8
velocity_stale_timeout_s: 0.75
max_abs_velocity_mps: 0.05
max_speed_mps: 0.08
range_stale_timeout_s: 0.75
range_ground_advisory_m: 0.04
min_reliable_zrange_m: 0.10
max_reliable_zrange_m: 0.50
estimator_stale_timeout_s: 1.5
max_estimator_variance_span: 0.002
minimum_estimator_sample_count: 5
# CF8.1 step 3.6: the estimator convergence check reads kalman.varPX/varPY/varPZ (Kalman
# velocity covariance), the same source cflib's wait_for_position_estimator() uses.
# These two keys are a fail-closed saturation guard only, not a tuning knob: a covariance
# at or above estimator_max_covariance * estimator_saturation_fraction is refused no matter
# how stable it looks, because the firmware clamps its covariance diagonal at
# MAX_COVARIANCE. Healthy velocity covariance measured on cf231 is 1.2e-4 .. 2.4e-4, so
# the 50.0 guard below sits five orders of magnitude away from real data.
estimator_max_covariance: 100.0
estimator_saturation_fraction: 0.5
frame_origin_max_age_s: 300
frame_origin_allowed_clock_skew_s: 5
cf8_explicit_arm_required: false
cf8_takeoff_delta_m: 0.25
cf8_takeoff_duration_s: 2.5
cf8_hover_duration_s: 3.0
cf8_land_duration_s: 2.5
cf8_takeoff_timeout_s: 8.0
cf8_landing_timeout_s: 8.0
cf8_service_timeout_s: 2.0
cf8_z_acceptance_tolerance_m: 0.08
cf8_xy_drift_tolerance_m: 0.15
cf8_settle_velocity_mps: 0.08
cf8_settle_duration_s: 0.5
cf8_max_total_acceptance_time_s: 30.0
link_loss_policy: controlled_land
max_message_bytes: 65536
